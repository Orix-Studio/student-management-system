{% extends "base.html" %}
{% block title %}{{ student.first_name }} {{ student.last_name }}{% endblock %}
{% block content %}
  <h1>{{ student.first_name }} {{ student.last_name }}</h1>
  <table>
    <tr><th>Id</th><td>{{ student.student_id }}</td></tr>
    <tr><th>Email</th><td>{{ student.email }}</td></tr>
    <tr><th>Class</th><td>{{ student.class_name }}</td></tr>
  </table>
  <p><a href="{{ url_for('students.student_list') }}">Back to all students</a></p>
{% endblock %}
