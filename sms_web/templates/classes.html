{% extends "base.html" %}
{% block title %}Classes{% endblock %}
{% block content %}
  <h1>Classes</h1>
  <table>
    <tr><th>Class</th><th>Students</th></tr>
    {% for c in classes %}
      <tr>
        <td><a href="{{ url_for('classes.class_detail', class_name=c.class_name) }}">{{ c.class_name }}</a></td>
        <td>{{ c.student_count }} students</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
