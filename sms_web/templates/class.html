{% extends "base.html" %}
{% block title %}Class {{ class_name }}{% endblock %}
{% block content %}
<h1>Class {{ class_name }}</h1>
<p>{{ students|length }} students</p>
<ul>
  {% for s in students %}
    <li><a href="{{ url_for('students.student_detail', student_id=s.student_id) }}">{{ s.first_name }} {{ s.last_name }}</a></li>
  {% endfor %}
</ul>
<p><a href="{{ url_for('classes.class_list') }}">All classes</a></p>
{% endblock %}
